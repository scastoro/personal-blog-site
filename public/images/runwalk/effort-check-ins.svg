<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title description">
  <title id="title">How hard each run felt</title>
  <desc id="description">Self-reported effort out of ten: October 22, seven; October 25, six; October 28, five; November 1, four. The workouts were not all the same length.</desc>
  <rect width="720" height="360" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#0f172a">
    <text x="32" y="39" font-size="21" font-weight="700">How hard each run felt</text>
    <text x="32" y="65" font-size="14" fill="#475569">My effort check-in · 1–10 scale</text>
    <g stroke="#cbd5e1">
      <path d="M76 100H684 M76 180H684 M76 260H684"/>
    </g>
    <g font-size="13" fill="#475569" text-anchor="end">
      <text x="62" y="105">10</text>
      <text x="62" y="185">5</text>
      <text x="62" y="265">0</text>
    </g>
    <g fill="#c2410c">
      <rect x="116" y="148" width="80" height="112" rx="5"/>
      <rect x="264" y="164" width="80" height="96" rx="5"/>
    </g>
    <g fill="#0f766e">
      <rect x="412" y="180" width="80" height="80" rx="5"/>
      <rect x="560" y="196" width="80" height="64" rx="5"/>
    </g>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="156" y="136">7</text>
      <text x="304" y="152">6</text>
      <text x="452" y="168">5</text>
      <text x="600" y="184">4</text>
    </g>
    <g font-size="14" text-anchor="middle">
      <text x="156" y="285">Oct 22</text>
      <text x="304" y="285">Oct 25</text>
      <text x="452" y="285">Oct 28</text>
      <text x="600" y="285">Nov 1</text>
    </g>
    <g font-size="12" text-anchor="middle" fill="#475569">
      <text x="156" y="305">Unstructured</text>
      <text x="304" y="305">7 jogs</text>
      <text x="452" y="305">6-jog plan</text>
      <text x="600" y="305">6-jog plan</text>
    </g>
    <text x="32" y="338" font-size="12" fill="#475569">Different workloads. Only the last two sessions followed the same plan.</text>
  </g>
</svg>
